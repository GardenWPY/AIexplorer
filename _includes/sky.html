<style>
  .sky-band {
    position: absolute; top: 0; left: 0; right: 0; height: 160px;
    overflow: hidden; z-index: 0; pointer-events: none;
  }
  .sky-band .sky-hills { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .site-header, main.container { position: relative; z-index: 1; }
  .sky-cloud {
    position: absolute; top: var(--top); left: var(--left);
    width: calc(100px * var(--scale, 1)); transform: translateX(-50%);
    animation: cloud-drift var(--dur, 9s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  .sky-cloud svg { display: block; width: 100%; height: auto; }
  @keyframes cloud-drift {
    from { transform: translateX(calc(-50% - 5px)); }
    to { transform: translateX(calc(-50% + 5px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sky-cloud { animation: none; }
  }
</style>

  <span class="sky-cloud" style="--left:36%;--top:18px;--scale:1.08;--dur:9s;--delay:.6s"><svg viewBox="0 0 100 44" xmlns="http://www.w3.org/2000/svg"><g fill="#fff" opacity=".86"><ellipse cx="28" cy="27" rx="22" ry="13"/><ellipse cx="50" cy="17" rx="24" ry="16"/><ellipse cx="72" cy="26" rx="20" ry="13"/><rect x="26" y="26" width="50" height="14" rx="7"/></g></svg></span>
